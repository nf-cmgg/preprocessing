lint:
  files_exist:
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awsfulltest.yml
    - .github/workflows/awstest.yml
    - CITATIONS.md
    - CODE_OF_CONDUCT.md
    - assets/nf-core-preprocessing_logo_light.png
    - docs/CONTRIBUTING.md
    - docs/images/nf-core-preprocessing_logo_dark.png
    - docs/images/nf-core-preprocessing_logo_light.png
  files_unchanged:
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .gitignore
    - CODE_OF_CONDUCT.md
    - LICENSE
    - assets/nf-core-preprocessing_logo_light.png
    - docs/README.md
    - docs/images/nf-core-preprocessing_logo_dark.png
    - docs/images/nf-core-preprocessing_logo_light.png
  merge_markers:
    - bin/cmgg_genelists
    - .pixi/envs
  multiqc_config: false
  nextflow_config: false
  schema_params: false # TMP
  template_strings:
    - bin/cmgg_genelists
  nf_test_content: false
nf_core_version: 4.0.2
repository_type: pipeline
template:
  author: Matthias De Smet, Nicolas Vannieuwkerke
  description: Demultiplexing, adapter trimming, alignment, and coverage calculation for NGS data.
  force: false
  is_nfcore: false
  name: preprocessing
  org: nf-cmgg
  outdir: .
  skip_features: ["fastqc"]
  version: 3.0.1
