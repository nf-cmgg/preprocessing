lint:
  files_exist:
    - CODE_OF_CONDUCT.md
    - CITATIONS.md
    - assets/nf-core-preprocessing_logo_light.png
    - docs/images/nf-core-preprocessing_logo_light.png
    - docs/images/nf-core-preprocessing_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-preprocessing_logo_light.png
    - docs/images/nf-core-preprocessing_logo_light.png
    - docs/images/nf-core-preprocessing_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - docs/README.md
    - LICENSE
  merge_markers:
    - bin/cmgg_genelists
  multiqc_config:
    - report_comment
  nextflow_config:
    - manifest.name
    - manifest.homePage
  template_strings:
    - bin/cmgg_genelists
  nf_test_content: false
  subworkflow_changes:
    - fastq_align_dna
nf_core_version: 3.4.1
repository_type: pipeline
template:
  author: Matthias De Smet, Nicolas Vannieuwkerke
  description: Demultiplexing, adapter trimming, alignment, and coverage calculation
    for NGS data.
  force: false
  is_nfcore: false
  name: preprocessing
  org: nf-cmgg
  outdir: .
  skip_features: []
  version: 2.1.0dev
